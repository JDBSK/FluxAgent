<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">FluxAgent state, memory, context, and sub-agent design</title>
  <desc id="desc">Checkpoint state, bounded context, retrieved long-term memory, and isolated sub-agents are combined into a controlled model invocation.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#eef3f4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#paper)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="56" y="58" fill="#16877f" font-size="17" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="2">STATE, MEMORY &amp; DELEGATION</text>
    <text x="56" y="94" fill="#14263d" font-size="30" font-weight="700">把状态、记忆和子 Agent 分开管理</text>
    <rect x="56" y="132" width="318" height="210" rx="18" fill="#f1f4f6" stroke="#7d8c99" stroke-width="2"/>
    <rect x="441" y="132" width="318" height="210" rx="18" fill="#eeeafd" stroke="#7463c4" stroke-width="2"/>
    <rect x="826" y="132" width="318" height="210" rx="18" fill="#e0f2ef" stroke="#16877f" stroke-width="2"/>
    <text x="84" y="174" fill="#435566" font-size="22" font-weight="600">Checkpoint &amp; Context</text>
    <text x="84" y="210" fill="#647481" font-size="20">任务计划 · 步骤 · 审批状态</text>
    <text x="84" y="240" fill="#647481" font-size="20">最近完整回合 · 摘要</text>
    <text x="84" y="270" fill="#647481" font-size="20">完整回合裁剪 · 重启恢复</text>
    <text x="84" y="314" fill="#7b8792" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">state.sqlite3</text>
    <text x="469" y="174" fill="#5b4ba7" font-size="22" font-weight="600">Long-term Memory</text>
    <text x="469" y="210" fill="#756ca0" font-size="20">用户事实与偏好 · 审批后写入</text>
    <text x="469" y="240" fill="#756ca0" font-size="20">工具经验 · 真实结果为依据</text>
    <text x="469" y="270" fill="#756ca0" font-size="20">事件落库 · 后台投影 · 检索</text>
    <text x="469" y="314" fill="#887db5" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">event log → query view</text>
    <text x="854" y="174" fill="#176b66" font-size="22" font-weight="600">Sub-agents</text>
    <text x="854" y="210" fill="#4c7774" font-size="20">只接收任务和必要背景</text>
    <text x="854" y="240" fill="#4c7774" font-size="20">独立 thread · 权限可收窄</text>
    <text x="854" y="270" fill="#4c7774" font-size="20">并发限制 · 审批原地恢复</text>
    <text x="854" y="314" fill="#628380" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">task → structured result</text>
    <text x="600" y="385" fill="#687685" font-size="20" text-anchor="middle">当前任务状态、相关记忆与子任务结果，汇入主 Agent 上下文</text>
  </g>
</svg>
